name: Missed or wrong pattern
description: The scanner missed SiriKit code, or flagged something it shouldn't have
labels: ["detection"]
body:
  - type: markdown
    attributes:
      value: |
        Detection is regex-based and line-oriented, so real-world code shapes are exactly
        what it gets wrong. These reports are the most useful thing you can file.
  - type: textarea
    id: source
    attributes:
      label: The source line (or a few lines around it)
      description: A minimal snippet is enough — please don't paste a whole file.
      render: swift
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What went wrong
      options:
        - Missed it entirely (false negative)
        - Flagged something that isn't SiriKit (false positive)
        - Detected, but the suggested migration is wrong
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `app-intents-migrator --version`
    validations:
      required: true
